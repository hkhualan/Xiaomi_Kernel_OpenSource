name: Build Kernel with Clang

on:
  push:
    branches:
      - bsp-dali-v-oss
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel Image (Clang 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      KERNEL_DIR: Xiaomi_Kernel_OpenSource-bsp-dali-v-oss

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            pahole \
            xz-utils \
            gzip \
            make \
            gcc \
            binutils \
            kmod \
            cpio \
            rsync \
            clang-18 \
            lld-18 \
            llvm-18 \
            llvm-ar-18 \
            llvm-objcopy-18

      - name: Create compiler symlinks
        run: |
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-18 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-objcopy-18 /usr/local/bin/llvm-objcopy

      - name: Verify compiler versions
        run: |
          echo "=== Compiler Versions ==="
          clang-18 --version
          ld.lld-18 --version
          llvm-ar-18 --version

      - name: Check kernel source
        run: |
          if [ ! -d "${{ env.KERNEL_DIR }}" ]; then
            echo "Error: Kernel source directory not found!"
            ls -la
            exit 1
          fi
          cd ${{ env.KERNEL_DIR }}
          echo "Kernel source found:"
          ls -la Makefile .config 2>/dev/null || echo "No .config found"

      - name: Build Kernel Image
        run: |
          cd ${{ env.KERNEL_DIR }}
          
          export CC=clang-18
          export LD=ld.lld-18
          export AR=llvm-ar-18
          export OBJCOPY=llvm-objcopy-18
          
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=$CC \
            LD=$LD \
            AR=$AR \
            OBJCOPY=$OBJCOPY \
            -j$(nproc) \
            Image

      - name: Verify build output
        run: |
          cd ${{ env.KERNEL_DIR }}
          echo "=== Build Output ==="
          if [ -f "arch/arm64/boot/Image" ]; then
            echo "SUCCESS: Image built!"
            ls -lh arch/arm64/boot/Image
          else
            echo "FAILED: Image not found!"
            ls -la arch/arm64/boot/
            exit 1
          fi

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-Clang18
          path: ${{ env.KERNEL_DIR }}/arch/arm64/boot/Image
          retention-days: 30
