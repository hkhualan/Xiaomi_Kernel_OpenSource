name: Build Kernel with Clang

on:
  push:
    branches:
      - bsp-dali-v-oss
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-kernel:
    name: Build Kernel Image (Clang 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      CLANG_VER: "18"
      LLVM_VER: "18"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            pahole \
            xz-utils \
            gzip \
            make \
            gcc \
            binutils \
            kmod \
            cpio \
            rsync \
            software-properties-common \
            wget \
            gnupg \
            ca-certificates

      - name: Add LLVM 18 repository
        run: |
          # Add GPG key
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          
          # Add LLVM 18 repository for Ubuntu 24.04 (noble)
          sudo add-apt-repository \
            "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-18 main"
          
          sudo apt-get update

      - name: Install Clang 18 and LLVM tools
        run: |
          sudo apt-get install -y \
            clang-18 \
            lld-18 \
            llvm-18 \
            llvm-18-dev \
            libclang-18-dev
          
          # Create symlinks for easier Makefile integration
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang
          sudo ln -sf /usr/bin/ld.lld-18 /usr/local/bin/ld.lld
          sudo ln -sf /usr/bin/llvm-ar-18 /usr/local/bin/llvm-ar
          sudo ln -sf /usr/bin/llvm-nm-18 /usr/local/bin/llvm-nm
          sudo ln -sf /usr/bin/llvm-objcopy-18 /usr/local/bin/llvm-objcopy
          sudo ln -sf /usr/bin/llvm-strip-18 /usr/local/bin/llvm-strip
          
          # Verify installation
          echo "=== Compiler Versions ==="
          clang-18 --version | head -3
          ld.lld-18 --version | head -2

      - name: Check kernel source
        run: |
          echo "=== Kernel Source Check ==="
          pwd
          ls -la
          
          # Verify this is a kernel source tree
          if [ ! -f "Makefile" ]; then
            echo "Error: Makefile not found!"
            exit 1
          fi
          
          if [ ! -f "arch/arm64/boot/Makefile" ]; then
            echo "Error: arch/arm64/boot/Makefile not found!"
            exit 1
          fi
          
          # Show kernel version
          echo "=== Kernel Version ==="
          head -n 5 Makefile

      - name: Check kernel config
        run: |
          if [ ! -f ".config" ]; then
            echo "Warning: No .config file found!"
            echo "Please provide a kernel config file."
            exit 1
          fi
          echo "=== Kernel Config ==="
          head -n 20 .config

      - name: Build Kernel Image with Clang
        run: |
          # Set compiler variables
          export CC=clang-18
          export LD=ld.lld-18
          export AR=llvm-ar-18
          export NM=llvm-nm-18
          export OBJCOPY=llvm-objcopy-18
          export STRIP=llvm-strip-18
          
          # Build only Image target (skip device trees)
          # This is suitable for phones that use stock DTB
          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=$CC \
            LD=$LD \
            AR=$AR \
            NM=$NM \
            OBJCOPY=$OBJCOPY \
            -j$(nproc) \
            Image

      - name: Verify build output
        run: |
          echo "=== Build Output ==="
          if [ -f "arch/arm64/boot/Image" ]; then
            echo "✅ Image built successfully!"
            ls -lh arch/arm64/boot/Image
            file arch/arm64/boot/Image
          else
            echo "❌ Image build failed!"
            exit 1
          fi

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v5
        with:
          name: Image-Clang18-${{ github.sha }}
          path: arch/arm64/boot/Image
          retention-days: 30
          if-no-files-found: error
